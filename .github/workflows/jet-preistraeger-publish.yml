name: JET-Preisträger veröffentlichen

# Trägt die Preisträger des JET-Jugendpreises 2026 in data/jet.json,
# data/fokus.json und data/aktuelles.json ein (Skript:
# .github/scripts/jet-preistraeger-publish.py, Daten:
# .github/scripts/jet-preistraeger.json).
#
# NUR MANUELL (kein Cron): Die Veröffentlichung wird nach der Verleihung von Hand gestartet.
#   Actions -> "JET-Preisträger veröffentlichen" -> Run workflow, dry_run ausschalten (false).
#   Ein Cron wurde entfernt, weil GitHub geplante Läufe unzuverlässig und teils um Stunden verzögert startet
#   (am 20.11.2026 veröffentlichte der verzögerte Lauf vom 19.11. die Preisträger um 02:38 MEZ, rund 18 Stunden
#   vor der Verleihung). Der manuelle Lauf überspringt die Datumssperre im Skript (sie gilt nur beim Ereignis
#   "schedule"). Idempotent: Sind in data/jet.json schon Preisträger eingetragen, ändert der Lauf nichts.
#
# Voraussetzung: Die Platzierung liegt im Repo-Secret JET_PLATZIERUNG (JSON
# {"Name": Platz}, Namen wie in jet-preistraeger.json; verschlüsselt, vor der
# Verleihung nirgends lesbar) oder als "platz" in jet-preistraeger.json. Sonst
# bricht der Lauf mit Fehler ab und veröffentlicht nichts.
#
# Trockenlauf (Standard): "Run workflow" mit dry_run = true. Rechnet mit angenommenen
# Platzierungen, zeigt den Diff im Log, committet nichts.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Trockenlauf (kein Commit, Platzierungen nur angenommen)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preisträger eintragen
        env:
          JET_PLATZIERUNG: ${{ secrets.JET_PLATZIERUNG }}
        run: python .github/scripts/jet-preistraeger-publish.py

      - name: JSON-Dateien auf gültige Syntax prüfen
        run: |
          set -e
          for f in data/jet.json data/fokus.json data/aktuelles.json; do
            echo "Prüfe $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Änderung committen und pushen (nur bei tatsächlicher Änderung)
        run: |
          set -e
          git add data/jet.json data/fokus.json data/aktuelles.json
          if git diff --cached --quiet; then
            echo "Keine Änderung – nichts zu committen."
            exit 0
          fi
          git --no-pager diff --cached
          if [ "$DRY_RUN" = "1" ]; then
            echo "Trockenlauf: kein Commit."
            exit 0
          fi
          git config user.name "SGK Thüringen"
          git config user.email "sgk-thueringen@users.noreply.github.com"
          git commit -m "JET-Jugendpreis 2026: Preisträger automatisch veröffentlicht"
          git pull --rebase origin main
          git push origin HEAD:main
