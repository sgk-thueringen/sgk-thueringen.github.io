name: JET-Preisträger veröffentlichen

# Trägt die Preisträger des JET-Jugendpreises 2026 in data/jet.json,
# data/fokus.json und data/aktuelles.json ein (Skript:
# .github/scripts/jet-preistraeger-publish.py, Daten:
# .github/scripts/jet-preistraeger.json).
#
# AUTOMATISCH AB 21:00 UHR BERLINER ZEIT, SONST MANUELL:
#   Der Cron (alle 15 Minuten, 20:00 bis 23:45 UTC = 21:00 bis 00:45 Uhr MEZ) startet den Lauf. Veröffentlicht
#   wird erst, wenn die Berliner Ortszeit die Zeit aus VEROEFFENTLICHEN_AB (unten im Job, Format
#   "JJJJ-MM-TT HH:MM", Berliner Ortszeit) erreicht hat, geprüft mit Datum UND Uhrzeit im Skript. Früher
#   startende oder verzögerte Läufe tun nichts. Fehlt die Zeit oder ist sie nicht lesbar, wird nichts
#   veröffentlicht (Fehler). Idempotent: Sind in data/jet.json schon Preisträger eingetragen, ändert ein
#   Lauf nichts.
#   Manueller Start (Actions -> "JET-Preisträger veröffentlichen" -> Run workflow, dry_run ausschalten)
#   UMGEHT die Zeitsperre und veröffentlicht sofort.
#   NACH DER VERÖFFENTLICHUNG den schedule-Trigger wieder entfernen (Hinweis in OFFENE-PUNKTE.md).
#   Hintergrund: Am 20.11.2026 hatte ein verzögerter Lauf mit reiner Datumsprüfung die Preisträger um
#   02:38 MEZ veröffentlicht, rund 18 Stunden vor der Verleihung.
#
# Voraussetzung: Die Platzierung liegt im Repo-Secret JET_PLATZIERUNG (JSON
# {"Name": Platz}, Namen wie in jet-preistraeger.json; verschlüsselt, vor der
# Verleihung nirgends lesbar) oder als "platz" in jet-preistraeger.json. Sonst
# bricht der Lauf mit Fehler ab und veröffentlicht nichts.
#
# Trockenlauf (Standard bei manuellem Start): "Run workflow" mit dry_run = true. Rechnet mit angenommenen
# Platzierungen, zeigt den Diff im Log, committet nichts.

on:
  schedule:
    - cron: "*/15 21-23 * * *"   # UTC = 21:00 bis 00:45 Uhr MEZ; die Zeitsperre im Skript entscheidet
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Trockenlauf (kein Commit, Platzierungen nur angenommen)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      # Frühester Veröffentlichungszeitpunkt beim Cron-Lauf, Berliner Ortszeit, Format JJJJ-MM-TT HH:MM.
      # Manuelle Läufe ignorieren ihn. Fehlt er oder ist er ungültig, veröffentlicht der Cron-Lauf nichts.
      VEROEFFENTLICHEN_AB: "2026-11-20 21:00"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preisträger eintragen
        env:
          JET_PLATZIERUNG: ${{ secrets.JET_PLATZIERUNG }}
        run: python .github/scripts/jet-preistraeger-publish.py

      - name: JSON-Dateien auf gültige Syntax prüfen
        run: |
          set -e
          for f in data/jet.json data/fokus.json data/aktuelles.json; do
            echo "Prüfe $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Änderung committen und pushen (nur bei tatsächlicher Änderung)
        run: |
          set -e
          git add data/jet.json data/fokus.json data/aktuelles.json
          if git diff --cached --quiet; then
            echo "Keine Änderung – nichts zu committen."
            exit 0
          fi
          git --no-pager diff --cached
          if [ "$DRY_RUN" = "1" ]; then
            echo "Trockenlauf: kein Commit."
            exit 0
          fi
          git config user.name "SGK Thüringen"
          git config user.email "sgk-thueringen@users.noreply.github.com"
          git commit -m "JET-Jugendpreis 2026: Preisträger automatisch veröffentlicht"
          git pull --rebase origin main
          git push origin HEAD:main
