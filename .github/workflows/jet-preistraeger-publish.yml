name: JET-Preisträger veröffentlichen

# Trägt die Preisträger des JET-Jugendpreises 2026 in data/jet.json,
# data/fokus.json und data/aktuelles.json ein (Skript:
# .github/scripts/jet-preistraeger-publish.py, Daten:
# .github/scripts/jet-preistraeger.json).
#
# NUR NOCH MANUELL (Stand 23.11.2026):
#   Die Preisträger sind veröffentlicht (data/jet.json ist gefüllt); der schedule-Trigger (Cron) wurde entfernt.
#   Der Workflow läuft nur noch per Start von Hand (Actions -> "JET-Preisträger veröffentlichen" -> Run workflow,
#   dry_run ausschalten). Er ist idempotent: Sind in data/jet.json schon Preisträger eingetragen, ändert ein Lauf nichts.
#   Ein manueller Start umgeht die Zeitsperre VEROEFFENTLICHEN_AB (unten im Job) und veröffentlicht sofort.
#   Hintergrund: Am 20.11.2026 hatte ein verzögerter Lauf mit reiner Datumsprüfung die Preisträger um 02:38 MEZ
#   veröffentlicht, rund 18 Stunden vor der Verleihung (Zeitsperre danach eingebaut, jetzt entfällt der Cron).
#   Nach einem erfolgreichen Lauf mit Commit startet der Workflow "Deploy auf ALL-INKL (FTPS)" automatisch (workflow_run).
#   Das Secret JET_PLATZIERUNG wird nicht mehr gebraucht und kann gelöscht werden (siehe OFFENE-PUNKTE.md).
#
# Voraussetzung: Die Platzierung liegt im Repo-Secret JET_PLATZIERUNG (JSON
# {"Name": Platz}, Namen wie in jet-preistraeger.json; verschlüsselt, vor der
# Verleihung nirgends lesbar) oder als "platz" in jet-preistraeger.json. Sonst
# bricht der Lauf mit Fehler ab und veröffentlicht nichts.
#
# Trockenlauf (Standard bei manuellem Start): "Run workflow" mit dry_run = true. Rechnet mit angenommenen
# Platzierungen, zeigt den Diff im Log, committet nichts.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Trockenlauf (kein Commit, Platzierungen nur angenommen)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      # Frühester Veröffentlichungszeitpunkt für Cron-Läufe (Berliner Ortszeit, JJJJ-MM-TT HH:MM). Ohne schedule-Trigger
      # wirkungslos; manuelle Läufe ignorieren ihn ohnehin. Bleibt als Sicherung stehen, falls ein Cron wieder eingefügt wird.
      VEROEFFENTLICHEN_AB: "2026-11-20 22:00"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preisträger eintragen
        env:
          JET_PLATZIERUNG: ${{ secrets.JET_PLATZIERUNG }}
        run: python .github/scripts/jet-preistraeger-publish.py

      - name: JSON-Dateien auf gültige Syntax prüfen
        run: |
          set -e
          for f in data/jet.json data/fokus.json data/aktuelles.json; do
            echo "Prüfe $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Änderung committen und pushen (nur bei tatsächlicher Änderung)
        run: |
          set -e
          git add data/jet.json data/fokus.json data/aktuelles.json
          if git diff --cached --quiet; then
            echo "Keine Änderung – nichts zu committen."
            exit 0
          fi
          git --no-pager diff --cached
          if [ "$DRY_RUN" = "1" ]; then
            echo "Trockenlauf: kein Commit."
            exit 0
          fi
          git config user.name "SGK Thüringen"
          git config user.email "sgk-thueringen@users.noreply.github.com"
          git commit -m "JET-Jugendpreis 2026: Preisträger automatisch veröffentlicht"
          git pull --rebase origin main
          git push origin HEAD:main
