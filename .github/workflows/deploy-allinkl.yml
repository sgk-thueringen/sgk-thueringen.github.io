name: Deploy auf ALL-INKL (FTPS)

# Zweck: Lädt die Website per FTPS auf den ALL-INKL-Webspace hoch (Umzug von GitHub Pages zu
# ALL-INKL). GitHub Pages bleibt während der Umstellung aktiv; dieser Workflow lädt zusätzlich hoch.
#
# Auslöser (Phase 2):
#   1. push auf main (ohne reine Änderungen an **.md, .github/**, export/**, unterlagen/**): echter Upload.
#   2. workflow_run: nach erfolgreichem Abschluss von "Bundes-SGK-Feed abrufen" (täglich, committet data/bundes-sgk.json)
#      und "JET-Preisträger veröffentlichen" (committet data/*.json) auf main: echter Upload. Grund: Commits mit
#      GITHUB_TOKEN lösen keinen push-Trigger aus, ohne workflow_run käme deren Stand nie auf den Server.
#      Das sind die beiden einzigen Workflows, die nach main committen ("JSON-Daten validieren" committet nicht).
#   3. Manueller Start: GitHub -> Actions -> "Deploy auf ALL-INKL (FTPS)" -> Run workflow.
#      dry_run = true  (Standard): Trockenlauf, listet nur, was hochgeladen würde. Es wird nichts verändert.
#      dry_run = false: echter Upload.
#   Bei push und workflow_run ist dry-run immer aus (false). Hochgeladen wird immer der aktuelle Stand von main.
#   GitHub Pages bleibt bis zur DNS-Umstellung (Phase 3) aktiv; siehe OFFENE-PUNKTE.md (Hosterwechsel).
#
# Zugang (Werte stehen nie im Repo und werden nie ausgegeben):
#   Repository-Variablen: ALLINKL_FTP_SERVER, ALLINKL_FTP_USER
#   Secret:               ALLINKL_FTP_PASSWORD
# Verbindung: FTPS explizit, Port 21 (SFTP gibt es im Tarif nicht). Der FTP-Benutzer hat den Heimatordner
# /sgk-thueringen.de/, daher server-dir "./".
#
# Verwendete Action: SamKirkland/FTP-Deploy-Action v4.4.0 (Commit 110f9186c050f71550953127052e77650219c287),
# Eingaben geprüft an README, action.yml und src/parse.ts dieser Version.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Trockenlauf (nur anzeigen, nichts hochladen)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "export/**"
      - "unterlagen/**"
  workflow_run:
    workflows: ["Bundes-SGK-Feed abrufen", "JET-Preisträger veröffentlichen"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-allinkl
  cancel-in-progress: false

jobs:
  deploy:
    # Nach workflow_run nur bei Erfolg des auslösenden Workflows.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Immer der aktuelle Stand von main (bei push und workflow_run), beim manuellen Start der gewählte Branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}

      - name: Per FTPS nach ALL-INKL hochladen
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287   # v4.4.0
        with:
          server: ${{ vars.ALLINKL_FTP_SERVER }}
          username: ${{ vars.ALLINKL_FTP_USER }}
          password: ${{ secrets.ALLINKL_FTP_PASSWORD }}
          protocol: ftps            # explizites FTPS (verschlüsselt), nie Klartext-FTP
          port: 21
          security: strict          # Zertifikat muss gültig sein (Standard der Action ist "loose")
          local-dir: ./
          server-dir: ./
          # Immer ein String "true"/"false": Bei push und workflow_run ist inputs.dry_run leer (null), nicht false.
          # Der Ausdruck liefert dort ausdrücklich 'false' (echter Upload) und nur beim manuellen Start mit dry_run = true 'true'.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          # Ausschlussliste. Die drei ersten Zeilen sind der Standard der Action und stehen hier nochmals,
          # weil ein eigener Wert den Standard ersetzt. Der Rest gehört nicht zur Website.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .claude/**
            .nojekyll
            CNAME
            **/*.md
            **/*.ps1
            **/*.py
            export/**
            unterlagen/**
