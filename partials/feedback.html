<style>
/* Feedback-Knopf — öffnet das E-Mail-Programm mit vorbereiteter Nachricht (Betreff und
   aktuelle Seite, gesetzt in include.js), kein Formular und kein externer Dienst.
   Design-Tokens aus style.css mit Fallback, selbst-enthalten. */
/* Der Knopf steht am Seitenende im Textfluss und überdeckt deshalb nie Inhalt (auch nicht auf dem Handy).
   Erst ab 96rem Breite schwebt er unten rechts: Dort bleibt neben dem Inhalt (68rem) genug freier Rand. */
#sgk-feedback { padding: 1rem; padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px)); text-align: right; font-family: var(--font-text, system-ui, sans-serif); }
@media (min-width: 96rem) {
  #sgk-feedback { position: fixed; right: 1rem; bottom: 1rem; z-index: 1000; padding: 0; max-width: 12rem; }
}
#sgk-feedback-btn {
  display: inline-flex; align-items: center; gap: .4rem;
  background: var(--rot, #E3000F); color: #fff; text-decoration: none; border-radius: 999px;
  padding: .5rem .9rem; font: inherit; font-weight: 600; font-size: .88rem;
  box-shadow: 0 2px 8px rgba(0,0,0,.2); cursor: pointer;
}
#sgk-feedback-btn:hover { background: var(--rot-dunkel, #B3000C); }
#sgk-feedback-btn:focus-visible { outline: 3px solid var(--ink, #1f2933); outline-offset: 2px; }
#sgk-feedback-btn::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: #fff; }
#sgk-feedback-hint {
  display: inline-block; margin-top: .3rem; font-size: .72rem; color: var(--grau, #595959);
  background: rgba(255,255,255,.9); padding: .1rem .35rem; border-radius: .25rem;
}
</style>
<div id="sgk-feedback">
  <a id="sgk-feedback-btn"
     href="/kontakt/"
     title="Öffnet dein E-Mail-Programm"
     aria-label="Feedback geben – öffnet dein E-Mail-Programm, die aktuelle Seite steht in der Nachricht">Feedback geben</a>
  <br>
  <span id="sgk-feedback-hint">Öffnet dein E-Mail-Programm</span>
</div>
